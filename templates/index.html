<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver State Monitoring</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        h1 { font-size: 26px; font-weight: 600; margin: 0; }
        h1 span { background: #2563eb; color: white; font-size: 14px; font-weight: 500; padding: 2px 12px; border-radius: 20px; margin-left: 12px; }
        .lang-selector {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
            font-size: 14px;
            cursor: pointer;
        }
        .toolbar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e9edf2;
        }
        .btn {
            padding: 8px 18px; border: none; border-radius: 8px; font-weight: 500; font-size: 14px;
            cursor: pointer; background: #e9edf2; color: #1e293b; transition: all 0.15s;
        }
        .btn:hover { background: #d1d9e6; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-upload { background: #059669; color: white; }
        .btn-upload:hover { background: #047857; }
        #loading { display: none; color: #64748b; font-size: 14px; margin-left: 4px; }
        .video-row { display: flex; gap: 24px; margin-bottom: 24px; }
        .video-card { flex: 1; background: #0f172a; border-radius: 12px; overflow: hidden; }
        .video-card .label { color: #94a3b8; font-size: 13px; padding: 8px 14px; background: #1e293b; }
        .video-card img { width: 100%; height: auto; display: block; background: #0f172a; }
        .panel { background: #f8fafc; border-radius: 12px; padding: 16px 20px; border: 1px solid #e9edf2; }
        .panel h3 { margin-top: 0; margin-bottom: 12px; font-size: 17px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #e9edf2; padding: 10px 12px; text-align: center; font-weight: 600; }
        td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #e9edf2; }
        .badge { display: inline-block; padding: 4px 14px; border-radius: 30px; font-weight: 500; font-size: 13px; }
        .badge-normal { background: #dcfce7; color: #166534; }
        .badge-tired { background: #fef3c7; color: #92400e; }
        .badge-drowsy { background: #fee2e2; color: #991b1b; }
        .badge-ear { font-family: 'Courier New', monospace; font-weight: 600; }
        .footnote { margin-top: 14px; color: #94a3b8; font-size: 13px; }
        .footnote .badge { font-size: 12px; padding: 2px 10px; }
        input[type="file"] { display: none; }
        @media (max-width: 760px) { .video-row { flex-direction: column; } .container { padding: 16px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header-row">
        <h1 id="pageTitle">🚗 驾驶员状态感知 <span>Web 版</span></h1>
        <select id="langSelect" class="lang-selector" onchange="switchLanguage()">
            <option value="zh">中文</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" id="btnCamera" onclick="openCamera()">📷 打开摄像头</button>
        <button class="btn btn-danger" id="btnStop" onclick="closeCamera()">⏹ 停止</button>
        <label for="fileInput" class="btn btn-upload" id="btnUpload" style="cursor:pointer;">📂 上传图片</label>
        <input type="file" id="fileInput" accept="image/*" onchange="uploadImage(event)">
        <span id="loading">⏳ 处理中...</span>
    </div>

    <div class="video-row">
        <div class="video-card">
            <div class="label" id="labelOriginal">📷 原始画面</div>
            <img id="originalImage" src="">
        </div>
        <div class="video-card">
            <div class="label" id="labelResult">🧠 检测结果</div>
            <img id="resultImage" src="">
        </div>
    </div>

    <div class="panel">
        <h3 id="panelTitle">📋 实时检测数据</h3>
        <table>
            <thead>
                <tr>
                    <th id="thId">#</th>
                    <th id="thFatigue">疲劳状态</th>
                    <th id="thEar">EAR</th>
                    <th id="thEye">眼睛</th>
                </tr>
            </thead>
            <tbody id="resultTable">
                <tr><td colspan="4" id="waitingText" style="color:#94a3b8;">等待检测…</td></tr>
            </tbody>
        </table>
        <div class="footnote" id="footnoteText">
            * EAR 越低，闭眼程度越高；
            <span class="badge badge-normal">Normal</span>
            <span class="badge badge-tired">Tired</span>
            <span class="badge badge-drowsy">Drowsy</span>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. 语言包
    // ============================================================
    const LANG = {
        zh: {
            title: '🚗 驾驶员状态感知',
            titleBadge: 'Web 版',
            btnCamera: '📷 打开摄像头',
            btnStop: '⏹ 停止',
            btnUpload: '📂 上传图片',
            labelOriginal: '📷 原始画面',
            labelResult: '🧠 检测结果',
            panelTitle: '📋 实时检测数据',
            thId: '#',
            thFatigue: '疲劳状态',
            thEar: 'EAR',
            thEye: '眼睛',
            waiting: '等待检测…',
            noFace: '😞 未检测到人脸',
            stopped: '⏸️ 已停止',
            footnote: '* EAR 越低，闭眼程度越高；',
            loading: '⏳ 处理中...'
        },
        en: {
            title: '🚗 Driver State Monitoring',
            titleBadge: 'Web',
            btnCamera: '📷 Open Camera',
            btnStop: '⏹ Stop',
            btnUpload: '📂 Upload Image',
            labelOriginal: '📷 Original',
            labelResult: '🧠 Detection Result',
            panelTitle: '📋 Real-time Data',
            thId: '#',
            thFatigue: 'Fatigue State',
            thEar: 'EAR',
            thEye: 'Eye',
            waiting: 'Waiting for detection…',
            noFace: '😞 No face detected',
            stopped: '⏸️ Stopped',
            footnote: '* Lower EAR means more closed eyes；',
            loading: '⏳ Processing...'
        }
    };

    let currentLang = 'zh';

    // ============================================================
    // 2. 切换语言
    // ============================================================
    function switchLanguage() {
        const select = document.getElementById('langSelect');
        currentLang = select.value;
        applyLanguage(currentLang);
    }

    function applyLanguage(lang) {
        const t = LANG[lang];
        if (!t) return;

        document.getElementById('pageTitle').innerHTML = `${t.title} <span>${t.titleBadge}</span>`;
        document.getElementById('btnCamera').textContent = t.btnCamera;
        document.getElementById('btnStop').textContent = t.btnStop;
        document.getElementById('btnUpload').textContent = t.btnUpload;
        document.getElementById('labelOriginal').textContent = t.labelOriginal;
        document.getElementById('labelResult').textContent = t.labelResult;
        document.getElementById('panelTitle').textContent = t.panelTitle;
        document.getElementById('thId').textContent = t.thId;
        document.getElementById('thFatigue').textContent = t.thFatigue;
        document.getElementById('thEar').textContent = t.thEar;
        document.getElementById('thEye').textContent = t.thEye;
        document.getElementById('footnoteText').innerHTML = `${t.footnote} <span class="badge badge-normal">Normal</span> <span class="badge badge-tired">Tired</span> <span class="badge badge-drowsy">Drowsy</span>`;

        // 更新 loading 文字
        document.getElementById('loading').textContent = t.loading;

        // 如果表格里是等待/无脸/停止状态，也更新
        const tbody = document.getElementById('resultTable');
        const firstRow = tbody.querySelector('tr');
        if (firstRow && firstRow.cells.length === 4) {
            const text = firstRow.textContent.trim();
            if (text.includes('等待检测') || text.includes('Waiting')) {
                firstRow.innerHTML = `<td colspan="4" style="color:#94a3b8;">${t.waiting}</td>`;
            } else if (text.includes('未检测到人脸') || text.includes('No face')) {
                firstRow.innerHTML = `<td colspan="4" style="color:#94a3b8;">${t.noFace}</td>`;
            } else if (text.includes('已停止') || text.includes('Stopped')) {
                firstRow.innerHTML = `<td colspan="4" style="color:#94a3b8;">${t.stopped}</td>`;
            }
        }
    }

    // ============================================================
    // 3. Socket 逻辑（保持不变）
    // ============================================================
    let socket = io();
    let stream = null;
    let running = false;
    const video = document.createElement('video');

    socket.on('connect', () => console.log('✅ 已连接服务器'));

    socket.on('result', (data) => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('resultImage').src = data.image;

        const tbody = document.getElementById('resultTable');
        if (!data.results || data.results.length === 0) {
            const t = LANG[currentLang];
            tbody.innerHTML = `<tr><td colspan="4" style="color:#94a3b8;">${t.noFace}</td></tr>`;
            return;
        }
        let html = '';
        data.results.forEach((item) => {
            let badge = 'badge-normal';
            let statusText = item.fatigue;
            if (statusText.includes('Tired')) badge = 'badge-tired';
            if (statusText.includes('Drowsy')) badge = 'badge-drowsy';

            html += `<tr>
                <td>#${item.id}</td>
                <td><span class="badge ${badge}">${statusText}</span></td>
                <td><span class="badge-ear">${item.ear}</span></td>
                <td>${item.eye}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    });

    socket.on('error', (data) => {
        document.getElementById('loading').style.display = 'none';
        alert('服务器错误: ' + data.msg);
    });

    function sendFrame(dataUrl) {
        if (!running) return;
        socket.emit('image', { image: dataUrl });
    }

    function captureLoop() {
        if (!running || !stream) return;
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, 640, 480);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        document.getElementById('originalImage').src = dataUrl;
        document.getElementById('loading').style.display = 'inline';
        sendFrame(dataUrl);
        setTimeout(captureLoop, 120);
    }

    function openCamera() {
        if (running) return;
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then((s) => {
                stream = s;
                video.srcObject = s;
                video.play();
                running = true;
                document.getElementById('loading').style.display = 'none';
                captureLoop();
            })
            .catch((err) => {
                alert('摄像头启动失败: ' + err.message);
            });
    }

    function closeCamera() {
        running = false;
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }
        video.pause();
        video.srcObject = null;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('originalImage').src = '';
        document.getElementById('resultImage').src = '';
        const t = LANG[currentLang];
        document.getElementById('resultTable').innerHTML = `<tr><td colspan="4" style="color:#94a3b8;">${t.stopped}</td></tr>`;
    }

    function uploadImage(e) {
        if (running) closeCamera();
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            document.getElementById('originalImage').src = dataUrl;
            document.getElementById('loading').style.display = 'inline';
            socket.emit('image', { image: dataUrl });
        };
        reader.readAsDataURL(file);
    }

    // 页面加载完成后，默认应用中文
    document.addEventListener('DOMContentLoaded', () => {
        applyLanguage('zh');
        document.getElementById('langSelect').value = 'zh';
    });
</script>
</body>
</html>
